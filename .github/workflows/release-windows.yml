name: Build and release Windows ZIP

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/actions/setup-build/action.yml"
      - ".github/workflows/release-windows.yml"
  workflow_run:
    workflows:
      - Build and release macOS DMG
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') }}
    permissions:
      contents: read
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}

      - name: Set up build tools
        uses: ./.github/actions/setup-build
        with:
          rust-targets: x86_64-pc-windows-msvc

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./native/electron/package.json').version")"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            artifact="line-cheater-windows-ci-${{ github.run_id }}"
          else
            artifact="line-cheater-windows-${version}"
          fi
          {
            echo "version=${version}"
            echo "artifact=${artifact}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Electron tests
        if: ${{ github.event_name != 'workflow_run' }}
        shell: bash
        working-directory: native/electron
        run: npm test

      - name: Verify the real Windows LINE process gate
        shell: bash
        working-directory: native/electron
        run: node scripts/verify-windows-local-cleanup.cjs

      - name: Build and verify Windows package
        shell: bash
        working-directory: native/electron
        run: |
          npm run build:native:win
          node scripts/package-windows.cjs

      - name: Verify release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "native/electron/dist/LINE-Cheater-$env:VERSION-Windows-x64.zip"
          $sums = "native/electron/dist/SHA256SUMS-Windows-x64.txt"
          if (!(Test-Path -LiteralPath $zip)) { throw "Missing Windows ZIP: $zip" }
          if (!(Test-Path -LiteralPath $sums)) { throw "Missing Windows checksum file: $sums" }
          $expected = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = Get-Content -LiteralPath $sums | Select-Object -First 1
          if ($checksumLine -notmatch [regex]::Escape($expected)) {
            throw "Windows ZIP checksum does not match $sums"
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.artifact }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-*-Windows-x64.zip
            native/electron/dist/SHA256SUMS-Windows-x64.txt

  attach:
    if: ${{ github.event_name == 'workflow_run' }}
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Attach Windows package to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release view "$tag" --repo "$REPOSITORY" >/dev/null
          gh release upload "$tag" \
            "dist/LINE-Cheater-${VERSION}-Windows-x64.zip" \
            "dist/SHA256SUMS-Windows-x64.txt" \
            --repo "$REPOSITORY" \
            --clobber
