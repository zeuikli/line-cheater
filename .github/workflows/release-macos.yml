name: Build and release macOS DMG

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/actions/setup-build/action.yml"
      - ".github/workflows/release-macos.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/actions/setup-build/action.yml"
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  checks:
    strategy:
      fail-fast: false
      # Push events only need the architecture-independent checks, so the Intel
      # runner is never started for a job whose every step would be skipped.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push'
          && '[{"arch":"arm64","runner":"macos-14"}]'
          || '[{"arch":"arm64","runner":"macos-14"},{"arch":"x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up build tools
        uses: ./.github/actions/setup-build
        with:
          rust-components: rustfmt, clippy

      - name: Prepare Tauri frontend for workspace checks
        if: ${{ matrix.arch == 'arm64' }}
        working-directory: native/tauri
        run: |
          npm ci
          npm run build:ui

      - name: Check Rust formatting
        if: ${{ matrix.arch == 'arm64' }}
        run: cargo fmt --all --check

      - name: Run Rust tests
        if: ${{ matrix.arch == 'arm64' }}
        run: cargo test --workspace

      - name: Run Rust clippy
        if: ${{ matrix.arch == 'arm64' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Electron tests
        if: ${{ matrix.arch == 'arm64' }}
        working-directory: native/electron
        run: npm test

      - name: Audit production dependencies
        if: ${{ matrix.arch == 'arm64' }}
        working-directory: native/electron
        run: npm audit --omit=dev

      - name: Build and verify macOS app and DMG
        if: ${{ github.event_name != 'push' }}
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
          SKIP_NPM_CI: "1"
          SKIP_NPM_TEST: "1"
        run: native/electron/scripts/package-dmg.sh

      - name: Verify macOS package outputs
        if: ${{ github.event_name != 'push' }}
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
        run: native/electron/scripts/verify-macos-package.sh

      - name: Upload macOS test artifact
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-macos-ci-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-*-macOS-${{ matrix.arch }}.dmg
            native/electron/dist/LINE-Cheater-*-macOS-${{ matrix.arch }}.zip
            native/electron/dist/SHA256SUMS.txt

  prepare:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_commit: ${{ steps.version.outputs.version_commit }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump patch version after merge
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_subject="$(git log -1 --format=%s)"
          if [[ "$commit_subject" == "chore(release): bump version to "* ]]; then
            echo "The latest main commit already contains the release version bump."
          else
            node native/electron/scripts/bump-version.cjs
            version="$(node -p "require('./native/electron/package.json').version")"
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock native/core/Cargo.toml native/electron/package.json native/electron/package-lock.json
            git commit -m "chore(release): bump version to ${version} [skip release]"
            git push origin HEAD:main
          fi

          version="$(node -p "require('./native/electron/package.json').version")"
          version_commit="$(git rev-parse HEAD)"
          {
            echo "version=${version}"
            echo "version_commit=${version_commit}"
          } >> "$GITHUB_OUTPUT"

  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out release version
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.version_commit }}

      - name: Set up build tools
        uses: ./.github/actions/setup-build

      - name: Import macOS signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: native/electron/scripts/import-signing-keychain.sh "build-${MACOS_ARCH}"

      - name: Build and verify DMG
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SKIP_NPM_CI: "1"
          SKIP_NPM_TEST: "1"
        run: native/electron/scripts/package-dmg.sh

      - name: Notarize and staple DMG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="native/electron/dist/LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg"
          native/electron/scripts/notarize-dmg.sh "$dmg"

      - name: Refresh checksums after DMG stapling
        shell: bash
        run: |
          set -euo pipefail
          cd native/electron/dist
          shasum -a 256 \
            "LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.zip" \
            "LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg" \
            > "SHA256SUMS-${MACOS_ARCH}.txt"

      - name: Verify release artifacts
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
          MACOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_CHECKSUM_FILE: SHA256SUMS-${{ matrix.arch }}.txt
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: native/electron/scripts/verify-macos-package.sh

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            native/electron/dist/LINE-Cheater-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.zip
            native/electron/dist/SHA256SUMS-${{ matrix.arch }}.txt

      - name: Remove temporary macOS signing material
        if: ${{ always() && steps.signing.outputs.available == 'true' }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: line-cheater-macos-*
          path: native/electron/release-artifacts
          merge-multiple: false

      - name: Assemble and verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact_root="native/electron/release-artifacts"
          dist="native/electron/dist"
          mkdir -p "$dist"
          : > "$dist/SHA256SUMS.txt"

          for arch in arm64 x64; do
            root="$artifact_root/line-cheater-macos-${arch}"
            test -f "$root/LINE-Cheater-${VERSION}-macOS-${arch}.dmg"
            test -f "$root/LINE-Cheater-${VERSION}-macOS-${arch}.zip"
            test -f "$root/SHA256SUMS-${arch}.txt"
            cp "$root/LINE-Cheater-${VERSION}-macOS-${arch}.dmg" "$dist/"
            cp "$root/LINE-Cheater-${VERSION}-macOS-${arch}.zip" "$dist/"
            cat "$root/SHA256SUMS-${arch}.txt" >> "$dist/SHA256SUMS.txt"
          done

          (
            cd "$dist"
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_COMMIT: ${{ needs.prepare.outputs.version_commit }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          dist="native/electron/dist"
          dmg_arm64="$dist/LINE-Cheater-${VERSION}-macOS-arm64.dmg"
          zip_arm64="$dist/LINE-Cheater-${VERSION}-macOS-arm64.zip"
          dmg_x64="$dist/LINE-Cheater-${VERSION}-macOS-x64.dmg"
          zip_x64="$dist/LINE-Cheater-${VERSION}-macOS-x64.zip"
          sums="$dist/SHA256SUMS.txt"
          notes=$'LINE Cheater macOS 12+ Apple Silicon 與 Intel (arm64/x64) 正式封裝。\n\n來源備份以唯讀方式開啟，候選輸出另存，不會覆寫原始檔。\n\n此版本的 arm64 與 x64 封裝均使用 Developer ID Application 簽署並完成 Apple notarization，DMG 已 stapled ticket。\n\n完整功能、安全規則與限制請參考 README：'
          notes+="https://github.com/${REPOSITORY}/blob/main/README.md"

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$dmg_arm64" "$zip_arm64" "$dmg_x64" "$zip_x64" "$sums" \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$tag" --repo "$REPOSITORY" --draft=false
          else
            gh release create "$tag" \
              "$dmg_arm64" "$zip_arm64" "$dmg_x64" "$zip_x64" "$sums" \
              --repo "$REPOSITORY" \
              --target "$VERSION_COMMIT" \
              --title "LINE Cheater v${VERSION}" \
              --notes "$notes" \
              --generate-notes
          fi
